name: Deploy

# Roda quando o CI passa na main (ou manualmente). Envia o código para a VPS
# por SSH e executa docker/prod/deploy.sh lá.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy na VPS
    if: github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://app-faixacerta.com.br
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Configurar SSH
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$VPS_KNOWN_HOSTS" > ~/.ssh/known_hosts

      - name: Empacotar e enviar
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
        run: |
          TARBALL=faixa-certa-${GITHUB_SHA::7}-${GITHUB_RUN_ID}.tar.gz
          git archive --format=tar.gz -o "$TARBALL" HEAD
          scp -i ~/.ssh/deploy_key "$TARBALL" docker/prod/deploy.sh "root@$VPS_HOST:/tmp/"
          echo "TARBALL=$TARBALL" >> "$GITHUB_ENV"

      - name: Executar deploy
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
        run: |
          ssh -i ~/.ssh/deploy_key -o ServerAliveInterval=30 "root@$VPS_HOST" \
            "bash /tmp/deploy.sh /tmp/$TARBALL; status=\$?; rm -f /tmp/deploy.sh; exit \$status"
