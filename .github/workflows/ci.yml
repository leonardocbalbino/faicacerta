name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Valores só de CI (não são segredos reais).
  DATABASE_URL: postgresql://faixacerta:faixacerta@localhost:5432/faixacerta_test
  DATABASE_URL_TEST: postgresql://faixacerta:faixacerta@localhost:5432/faixacerta_test
  JWT_ACCESS_SECRET: ci-only-secret-with-at-least-32-characters-0000
  DATA_ENCRYPTION_KEY: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
  S3_ACCESS_KEY_ID: ci
  S3_SECRET_ACCESS_KEY: ci
  TURBO_TELEMETRY_DISABLED: '1'

jobs:
  checks:
    name: Lint, typecheck, testes unitários e build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  e2e:
    name: Testes E2E da API
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: faixacerta
          POSTGRES_PASSWORD: faixacerta
          POSTGRES_DB: faixacerta_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U faixacerta -d faixacerta_test"
          --health-interval 5s --health-timeout 3s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      # ffmpeg para o teste de processamento de vídeo (720p, offline, thumbnail).
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:e2e
