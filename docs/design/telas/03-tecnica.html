<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #0B0B0F; color: #F5F5F7; font-family: Inter, system-ui, sans-serif">

<div style="height: 330px; background: #1A1A22; position: relative; display: flex; align-items: center; justify-content: center">
<div aria-hidden="true" style="position: absolute; inset: 0; background-image: radial-gradient(#2A2A35 1px, transparent 1px); background-size: 14px 14px"></div>
<a href="Apostila.dc.html" aria-label="Voltar" style="position: absolute; top: 56px; left: 16px; width: 44px; height: 44px; border-radius: 14px; background: #0B0B0FCC; color: #F5F5F7; display: flex; align-items: center; justify-content: center"><svg aria-hidden="true" width="22" height="22" sc-camel-view-box="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 5-7 7 7 7"></path></svg></a>
<button aria-label="Salvar nos favoritos" sc-camel-on-click="{{toggleFav}}" style="position: absolute; top: 56px; right: 16px; width: 44px; height: 44px; border-radius: 14px; border: 0; background: #0B0B0FCC; color: {{favColor}}; display: flex; align-items: center; justify-content: center; cursor: pointer"><svg aria-hidden="true" width="22" height="22" sc-camel-view-box="0 0 24 24" fill="{{favFill}}" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="M6 3h12v18l-6-4-6 4z"></path></svg></button>
<button aria-label="Reproduzir vídeo" style="position: relative; width: 72px; height: 72px; border-radius: 36px; border: 0; background: {{accent}}; display: flex; align-items: center; justify-content: center; cursor: pointer"><svg aria-hidden="true" width="28" height="28" sc-camel-view-box="0 0 24 24" fill="#0B0B0F"><path d="M7 4v16l13-8z"></path></svg></button>
<div style="position: absolute; left: 16px; right: 16px; bottom: 14px; display: flex; justify-content: space-between; align-items: center">
<div role="group" aria-label="Velocidade" style="display: flex; gap: 6px; background: #0B0B0FCC; padding: 4px; border-radius: 12px">
<sc-for list="{{speeds}}" as="s" hint-placeholder-count="3">
<button sc-camel-on-click="{{s.pick}}" aria-pressed="{{s.on}}" style="{{s.style}}">{{s.label}}</button>
</sc-for>
</div>
<span style="font-size: 12px; font-weight: 600; background: #0B0B0FCC; padding: 8px 10px; border-radius: 10px">Vídeo · 0:42</span>
</div>
</div>

<div style="padding: 20px 20px 0; display: flex; flex-direction: column; gap: 18px">
<div style="display: flex; justify-content: space-between; align-items: flex-start">
<div style="display: flex; flex-direction: column; gap: 6px">
<h1 style="margin: 0; font-family: 'Bricolage Grotesque', sans-serif; font-size: 32px; font-weight: 800; line-height: 1">O-soto-gari</h1>
<span style="font-size: 14px; color: #A1A1AA">Grande gancho externo · Nage-waza</span>
</div>
<button aria-label="Ouvir pronúncia" style="width: 44px; height: 44px; border-radius: 22px; border: 1px solid #26262F; background: #16161D; color: #F5F5F7; display: flex; align-items: center; justify-content: center; cursor: pointer"><svg aria-hidden="true" width="20" height="20" sc-camel-view-box="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9v6h4l5 4V5L8 9z"></path><path d="M16.5 8.5a5 5 0 0 1 0 7"></path></svg></button>
</div>

<section aria-label="Passo a passo" style="display: flex; flex-direction: column; gap: 10px">
<h2 style="margin: 0; font-size: 13px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: #A1A1AA">Passo a passo</h2>
<div style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px">
<sc-for list="{{steps}}" as="st" hint-placeholder-count="4">
<div style="height: 84px; border-radius: 14px; background: #16161D; border: 1px solid #26262F; padding: 8px; display: flex; flex-direction: column; justify-content: space-between">
<span style="font-family: 'Bricolage Grotesque', sans-serif; font-size: 18px; font-weight: 800; color: {{accent}}">{{st.n}}</span>
<span style="font-size: 11px; color: #A1A1AA">{{st.label}}</span>
</div>
</sc-for>
</div>
</section>

<section aria-label="Pontos-chave" style="display: flex; flex-direction: column; gap: 10px">
<h2 style="margin: 0; font-size: 13px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: #A1A1AA">Pontos-chave</h2>
<ul style="margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 10px">
<sc-for list="{{keys}}" as="k" hint-placeholder-count="3">
<li style="display: flex; gap: 10px; font-size: 14px; line-height: 1.4"><svg aria-hidden="true" width="20" height="20" sc-camel-view-box="0 0 24 24" fill="none" stroke="{{accent}}" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" style="flex: none; margin-top: 1px"><path d="m5 12 5 5 9-10"></path></svg><span>{{k}}</span></li>
</sc-for>
</ul>

<div style="position: absolute; left: 0; right: 0; bottom: 0; padding: 12px 20px 30px; background: #0B0B0F; border-top: 1px solid #1F1F29; display: flex; gap: 10px">
<button style="flex: 1; height: 52px; border-radius: 16px; border: 1px solid #3A3A46; background: transparent; color: #F5F5F7; font: inherit; font-size: 15px; font-weight: 600; cursor: pointer">Comparar meu vídeo</button>
<button style="flex: 1; height: 52px; border-radius: 16px; border: 0; background: {{accent}}; color: #0B0B0F; font: inherit; font-size: 15px; font-weight: 700; cursor: pointer">Já domino</button>

<script type="text/x-dc" data-dc-script="" data-props="{&quot;accent&quot;:{&quot;editor&quot;:&quot;color&quot;,&quot;default&quot;:&quot;#D4FF3A&quot;,&quot;options&quot;:[&quot;#D4FF3A&quot;,&quot;#5B8CFF&quot;,&quot;#FF5C8A&quot;,&quot;#2EE6A8&quot;]},&quot;$preview&quot;:{&quot;width&quot;:390,&quot;height&quot;:844}}">
class Component extends DCLogic {
constructor(props) { super(props); this.state = { speed: '0,5x', fav: true }; }
renderVals() {
const accent = this.props.accent ?? '#D4FF3A';
const speeds = ['0,25x', '0,5x', '1x'].map((label) => {
const on = this.state.speed === label;
return {
label, on: on ? 'true' : 'false',
pick: () => this.setState({ speed: label }),
style: 'min-width: 52px; height: 36px; border-radius: 9px; border: 0; font: inherit; font-size: 12px; font-weight: 700; cursor: pointer; ' + (on ? 'background: ' + accent + '; color: #0B0B0F' : 'background: transparent; color: #F5F5F7')
};
});
return {
accent, speeds,
favColor: this.state.fav ? accent : '#F5F5F7',
favFill: this.state.fav ? accent : 'none',
toggleFav: () => this.setState({ fav: !this.state.fav }),
steps: [{ n: '1', label: 'Pegada' }, { n: '2', label: 'Kuzushi' }, { n: '3', label: 'Entrada' }, { n: '4', label: 'Ceifada' }],
keys: [
'Desequilibre o uke para trás, sobre o calcanhar dele.',
'Pé de apoio firme ao lado do pé do uke.',
'Ceife com a parte de trás da coxa, mantendo o tronco à frente.'
]
};
}
}
</script>
