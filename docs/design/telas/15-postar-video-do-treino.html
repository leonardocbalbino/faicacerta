const on = this.state.tech === label;
return { label, on: on ? 'true' : 'false', pick: () => this.setState({ tech: label }), style: 'height: 40px; padding: 0 14px; border-radius: 999px; font: inherit; font-size: 14px; font-weight: 600; cursor: pointer; ' + (on ? 'background: ' + accent + '; color: #0B0B0F; border: 1px solid ' + accent : 'background: #16161D; color: #F5F5F7; border: 1px solid #26262F') };
});
const vis = [['turma', 'Só minha turma', 'Turma Adulto Noite · 24 pessoas'], ['publico', 'Público', 'Aparece em "Para você" para todos']].map(([id, label, sub]) => {
const on = this.state.vis === id;
return {
label, sub, checked: on ? 'true' : 'false',
pick: () => this.setState({ vis: id }),
style: 'min-height: 62px; border-radius: 18px; padding: 0 14px; display: flex; align-items: center; gap: 12px; color: #F5F5F7; font: inherit; cursor: pointer; background: #16161D; border: 2px solid ' + (on ? accent : '#26262F'),
dot: 'width: 22px; height: 22px; border-radius: 11px; flex: none; border: 2px solid ' + (on ? accent : '#5A5A66') + '; background: ' + (on ? accent : 'transparent') + '; box-shadow: ' + (on ? 'inset 0 0 0 4px #16161D' : 'none')
};
});
return { accent, techs, vis };
}
}
