<h1 style="margin: 0; font-family: 'Bricolage Grotesque', sans-serif; font-size: 36px; font-weight: 800; line-height: 1.02">Leve sua academia para o celular dos alunos.</h1>

<ul style="list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px">
<sc-for list="{{perks}}" as="p" hint-placeholder-count="6">

<svg aria-hidden="true" width="20" height="20" sc-camel-view-box="0 0 24 24" fill="none" stroke="{{accent}}" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="m5 12 5 5 9-10"></path></svg>
<span style="font-size: 14px; font-weight: 600; line-height: 1.25">{{p}}</span>
</li>
</sc-for>
</ul>

<div role="radiogroup" aria-label="Plano" style="display: flex; flex-direction: column; gap: 8px">
<sc-for list="{{plans}}" as="pl" hint-placeholder-count="2">
<button role="radio" aria-checked="{{pl.checked}}" sc-camel-on-click="{{pl.pick}}" style="{{pl.style}}">
<span style="{{pl.dot}}"></span>
<span style="flex: 1; display: flex; flex-direction: column; gap: 2px; text-align: left"><span style="font-size: 15px; font-weight: 700">{{pl.label}}</span><span style="font-size: 12px; color: #A1A1AA">{{pl.sub}}</span></span>

</sc-for>
</div>

<script type="text/x-dc" data-dc-script="" data-props="{&quot;accent&quot;:{&quot;editor&quot;:&quot;color&quot;,&quot;default&quot;:&quot;#D4FF3A&quot;,&quot;options&quot;:[&quot;#D4FF3A&quot;,&quot;#5B8CFF&quot;,&quot;#FF5C8A&quot;,&quot;#2EE6A8&quot;]},&quot;monthly&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;R$ 49,90&quot;,&quot;section&quot;:&quot;Preços (definidos no admin)&quot;},&quot;yearly&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;R$ 479,00&quot;,&quot;section&quot;:&quot;Preços (definidos no admin)&quot;},&quot;$preview&quot;:{&quot;width&quot;:390,&quot;height&quot;:844}}">
class Component extends DCLogic {
constructor(props) { super(props); this.state = { plan: 'anual' }; }
renderVals() {
const accent = this.props.accent ?? '#D4FF3A';
const monthly = this.props.monthly ?? 'R$ 49,90';
const yearly = this.props.yearly ?? 'R$ 479,00';
const plans = [['anual', 'Anual', 'Melhor custo · 2 meses grátis', yearly], ['mensal', 'Mensal', 'Sem fidelidade', monthly]].map(([id, label, sub, price]) => {
const on = this.state.plan === id;
return {
label, sub, price, checked: on ? 'true' : 'false',
pick: () => this.setState({ plan: id }),
style: 'min-height: 68px; border-radius: 20px; padding: 0 16px; display: flex; align-items: center; gap: 12px; color: #F5F5F7; font: inherit; cursor: pointer; background: #16161D; border: 2px solid ' + (on ? accent : '#26262F'),
dot: 'width: 22px; height: 22px; border-radius: 11px; flex: none; border: 2px solid ' + (on ? accent : '#5A5A66') + '; background: ' + (on ? accent : 'transparent') + '; box-shadow: ' + (on ? 'inset 0 0 0 4px #16161D' : 'none')
};
});
return {
accent, plans,
perks: ['Turmas e convites por QR', 'Material próprio com seus vídeos', 'Progresso de cada aluno', 'Lojinha com Pix direto, 0% de taxa', 'Avisos e data de exame', 'Sem anúncios para você e seus alunos']
};
}
}
</script>
