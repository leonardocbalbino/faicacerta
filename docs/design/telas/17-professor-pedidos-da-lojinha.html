<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #0B0B0F; color: #F5F5F7; font-family: Inter, system-ui, sans-serif">
<div style="padding: 60px 20px 0; display: flex; flex-direction: column; gap: 16px">
<header style="display: flex; align-items: center; justify-content: space-between">
<h1 style="margin: 0; font-family: 'Bricolage Grotesque', sans-serif; font-size: 30px; font-weight: 800">Lojinha</h1>
<button style="height: 44px; padding: 0 14px; border-radius: 14px; border: 0; background: {{accent}}; color: #0B0B0F; font: inherit; font-size: 14px; font-weight: 700; display: flex; align-items: center; gap: 6px; cursor: pointer"><svg aria-hidden="true" width="18" height="18" sc-camel-view-box="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14"></path><path d="M5 12h14"></path></svg>Produto</button>
</header>

<div style="border-radius: 22px; background: #16161D; border: 1px solid #26262F; padding: 16px; display: flex; flex-direction: column; gap: 12px">
<div style="display: flex; justify-content: space-between; align-items: flex-end">
<div style="display: flex; flex-direction: column; gap: 4px"><span style="font-size: 13px; color: #A1A1AA">Vendido em novembro</span><span style="font-family: 'Bricolage Grotesque', sans-serif; font-size: 30px; font-weight: 800; line-height: 1">R$ 1.248,60</span></div>
<span style="font-size: 12px; font-weight: 700; padding: 5px 9px; border-radius: 999px; background: #10251E; color: #2EE6A8">0% de taxa</span>
</div>
<div style="height: 1px; background: #26262F"></div>
<div style="display: flex; align-items: center; justify-content: space-between; font-size: 13px"><span style="color: #A1A1AA">Recebe em: Pix CPF •••.482.913-••</span><a href="#" style="font-weight: 600; text-decoration: none; min-height: 44px; display: flex; align-items: center">Editar</a></div>
</div>

<div role="tablist" aria-label="Status dos pedidos" style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 4px; padding: 4px; border-radius: 16px; background: #16161D; border: 1px solid #26262F">
<sc-for list="{{tabs}}" as="t" hint-placeholder-count="3">
<button role="tab" aria-selected="{{t.selected}}" sc-camel-on-click="{{t.pick}}" style="{{t.style}}">{{t.label}}</button>
</sc-for>
</div>

<div style="display: flex; flex-direction: column; gap: 10px">
<sc-for list="{{orders}}" as="o" hint-placeholder-count="3">
<div style="border-radius: 20px; background: #16161D; border: 1px solid #26262F; padding: 14px; display: flex; flex-direction: column; gap: 10px">
<div style="display: flex; justify-content: space-between; align-items: center"><span style="font-size: 15px; font-weight: 700">{{o.buyer}}</span><span style="font-size: 12px; color: #A1A1AA">#{{o.id}} · {{o.when}}</span></div>
<div style="display: flex; justify-content: space-between; align-items: center"><span style="font-size: 14px; color: #C8C8D0">{{o.items}}</span><span style="font-family: 'Bricolage Grotesque', sans-serif; font-size: 18px; font-weight: 800">{{o.total}}</span></div>
<sc-if value="{{o.pending}}" hint-placeholder-val="{{ true }}">
<div style="display: flex; gap: 8px">
<button style="flex: 1; height: 44px; border-radius: 12px; border: 1px solid #3A3A46; background: transparent; color: #F5F5F7; font: inherit; font-size: 13px; font-weight: 600; cursor: pointer">{{o.proof}}</button>
<button sc-camel-on-click="{{o.confirm}}" style="flex: 1; height: 44px; border-radius: 12px; border: 0; background: {{accent}}; color: #0B0B0F; font: inherit; font-size: 13px; font-weight: 700; cursor: pointer">Confirmar pago</button>
</div>
</sc-if>
<sc-if value="{{o.paid}}" hint-placeholder-val="{{ false }}">
<div style="display: flex; gap: 8px; align-items: center; justify-content: space-between"><span style="font-size: 12px; font-weight: 700; padding: 5px 9px; border-radius: 999px; background: #10251E; color: #2EE6A8">Pago</span><button sc-camel-on-click="{{o.deliver}}" style="height: 44px; padding: 0 14px; border-radius: 12px; border: 1px solid #3A3A46; background: transparent; color: #F5F5F7; font: inherit; font-size: 13px; font-weight: 600; cursor: pointer">Marcar entregue</button></div>
</sc-if>
</div>
</sc-for>
<sc-if value="{{empty}}" hint-placeholder-val="{{ false }}">
<div style="border-radius: 20px; border: 1px dashed #3A3A46; padding: 28px; text-align: center; font-size: 14px; color: #A1A1AA">Nenhum pedido aqui.</div>
</sc-if>
</div>

class Component extends DCLogic {
constructor(props) {
super(props);
this.state = {
tab: 'aguardando',
orders: [
{ id: '1042', buyer: 'Ana Lima', when: 'hoje', items: 'Faixa laranja × 1', total: 'R$ 39,90', status: 'aguardando', hasProof: true },
{ id: '1041', buyer: 'Caio Reis', when: 'hoje', items: 'Judogi A2 · Taxa de exame', total: 'R$ 369,90', status: 'aguardando', hasProof: false },
{ id: '1039', buyer: 'Davi Nunes', when: 'ontem', items: 'Camiseta M × 2', total: 'R$ 139,80', status: 'aguardando', hasProof: true },
{ id: '1035', buyer: 'Bia Costa', when: '20 nov', items: 'Taxa de exame', total: 'R$ 80,00', status: 'pago', hasProof: true },
{ id: '1030', buyer: 'Lucas Moura', when: '18 nov', items: 'Faixa amarela × 1', total: 'R$ 39,90', status: 'entregue', hasProof: true }
]
};
}
setStatus(id, status) {
this.setState({ orders: this.state.orders.map((o) => (o.id === id ? { ...o, status } : o)) });
}
renderVals() {
const accent = this.props.accent ?? '#D4FF3A';
const count = (s) => this.state.orders.filter((o) => o.status === s).length;
const tabs = [['aguardando', 'Aguardando'], ['pago', 'Pagos'], ['entregue', 'Entregues']].map(([id, label]) => {
const on = this.state.tab === id;
return { label: label + ' ' + count(id), selected: on ? 'true' : 'false', pick: () => this.setState({ tab: id }), style: 'height: 40px; border-radius: 12px; border: 0; font: inherit; font-size: 13px; font-weight: 600; cursor: pointer; ' + (on ? 'background: #F5F5F7; color: #0B0B0F' : 'background: transparent; color: #A1A1AA') };
});
const orders = this.state.orders.filter((o) => o.status === this.state.tab).map((o) => ({
...o,
pending: o.status === 'aguardando',
paid: o.status === 'pago',
proof: o.hasProof ? 'Ver comprovante' : 'Cobrar no WhatsApp',
confirm: () => this.setStatus(o.id, 'pago'),
deliver: () => this.setStatus(o.id, 'entregue')
}));
return { accent, tabs, orders, empty: orders.length === 0 };
}
}
</script>
