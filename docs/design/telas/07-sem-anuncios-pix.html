<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #0B0B0F; color: #F5F5F7; font-family: Inter, system-ui, sans-serif">
<div style="padding: 60px 20px 0; display: flex; flex-direction: column; gap: 22px">

<header style="display: flex; justify-content: space-between; align-items: center">
<sc-if value="{{isPix}}" hint-placeholder-val="{{ false }}">
<button aria-label="Voltar" sc-camel-on-click="{{back}}" style="width: 44px; height: 44px; border-radius: 14px; border: 1px solid #26262F; background: #16161D; color: #F5F5F7; display: flex; align-items: center; justify-content: center; cursor: pointer"><svg aria-hidden="true" width="20" height="20" sc-camel-view-box="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 5-7 7 7 7"></path></svg></button>
</sc-if>
<span></span>
<a href="Main.dc.html" aria-label="Fechar" style="width: 44px; height: 44px; border-radius: 14px; border: 1px solid #26262F; background: #16161D; color: #F5F5F7; display: flex; align-items: center; justify-content: center"><svg aria-hidden="true" width="20" height="20" sc-camel-view-box="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12"></path><path d="M18 6 6 18"></path></svg></a>
</header>

<sc-if value="{{isOffer}}" hint-placeholder-val="{{ true }}">
<div style="display: flex; flex-direction: column; gap: 22px">
<div aria-hidden="true" style="width: 84px; height: 84px; border-radius: 26px; background: {{accent}}; color: #0B0B0F; display: flex; align-items: center; justify-content: center; transform: rotate(-6deg)"><svg width="42" height="42" sc-camel-view-box="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="12" rx="3"></rect><path d="M3 21 21 3"></path></svg></div>
<h1 style="margin: 0; font-family: 'Bricolage Grotesque', sans-serif; font-size: 40px; font-weight: 800; line-height: 1.02">Estude sem<br>interrupções.</h1>
<p style="margin: 0; font-size: 16px; line-height: 1.5; color: #A1A1AA">Pague uma vez e nunca mais veja anúncios no Faixa Certa.</p>
<ul style="list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 12px">
<sc-for list="{{perks}}" as="p" hint-placeholder-count="3">
<li style="display: flex; gap: 12px; align-items: center; font-size: 15px"><span style="width: 28px; height: 28px; border-radius: 9px; background: #1F1F29; display: flex; align-items: center; justify-content: center; flex: none"><svg aria-hidden="true" width="16" height="16" sc-camel-view-box="0 0 24 24" fill="none" stroke="{{accent}}" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="m5 12 5 5 9-10"></path></svg></span>{{p}}</li>
</sc-for>
</ul>
<div style="border-radius: 24px; border: 2px solid {{accent}}; background: #16161D; padding: 18px 20px; display: flex; justify-content: space-between; align-items: center">
<div style="display: flex; flex-direction: column; gap: 4px"><span style="font-size: 13px; color: #A1A1AA">Pagamento único</span><span style="font-size: 14px; font-weight: 600">Vale para sempre, em qualquer aparelho</span></div>
<span style="font-family: 'Bricolage Grotesque', sans-serif; font-size: 34px; font-weight: 800; white-space: nowrap">{{price}}</span>
</div>
</div>
</sc-if>

<sc-if value="{{isPix}}" hint-placeholder-val="{{ false }}">
<div style="display: flex; flex-direction: column; gap: 18px; align-items: center">
<h1 style="margin: 0; align-self: flex-start; font-family: 'Bricolage Grotesque', sans-serif; font-size: 30px; font-weight: 800">Pague com Pix</h1>
<div role="img" aria-label="QR code Pix" style="width: 236px; height: 236px; border-radius: 24px; background: #FFFFFF; padding: 18px; display: grid; grid-template-columns: repeat(20, minmax(0, 1fr)); gap: 0">
<sc-for list="{{qr}}" as="c" hint-placeholder-count="400">
<span style="{{c.style}}"></span>
</sc-for>
</div>
<span style="font-family: 'Bricolage Grotesque', sans-serif; font-size: 30px; font-weight: 800">{{price}}</span>
<button sc-camel-on-click="{{copy}}" style="width: 100%; height: 52px; border-radius: 16px; border: 1px solid #3A3A46; background: #16161D; color: #F5F5F7; font: inherit; font-size: 15px; font-weight: 600; display: flex; align-items: center; justify-content: center; gap: 8px; cursor: pointer"><svg aria-hidden="true" width="18" height="18" sc-camel-view-box="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="8" y="8" width="12" height="12" rx="2"></rect><path d="M16 8V6a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v8a2 2 0 0 0 2 2h2"></path></svg>{{copyLabel}}</button>
<div style="width: 100%; border-radius: 16px; background: #16161D; padding: 14px 16px; display: flex; align-items: center; gap: 12px">
<span aria-hidden="true" style="width: 10px; height: 10px; border-radius: 5px; background: {{accent}}; box-shadow: 0 0 0 5px #D4FF3A33"></span>
<span style="flex: 1; font-size: 14px">Aguardando pagamento…</span>
<span style="font-size: 13px; color: #A1A1AA; font-variant-numeric: tabular-nums">expira em 14:32</span>
</div>
</div>
</sc-if>
</div>

<sc-if value="{{isOffer}}" hint-placeholder-val="{{ true }}">
<div style="position: absolute; left: 0; right: 0; bottom: 0; padding: 12px 20px 30px; display: flex; flex-direction: column; gap: 10px; align-items: center">
<button sc-camel-on-click="{{goPix}}" style="width: 100%; height: 56px; border-radius: 18px; border: 0; background: {{accent}}; color: #0B0B0F; font: inherit; font-size: 17px; font-weight: 700; cursor: pointer">Pagar {{price}} com Pix</button>
<span style="font-size: 12px; color: #A1A1AA">Precisa estar logado para vincular a compra à sua conta.</span>
</div>
</sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script="" data-props="{&quot;accent&quot;:{&quot;editor&quot;:&quot;color&quot;,&quot;default&quot;:&quot;#D4FF3A&quot;,&quot;options&quot;:[&quot;#D4FF3A&quot;,&quot;#5B8CFF&quot;,&quot;#FF5C8A&quot;,&quot;#2EE6A8&quot;]},&quot;price&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;R$ 10&quot;},&quot;$preview&quot;:{&quot;width&quot;:390,&quot;height&quot;:844}}">
class Component extends DCLogic {
constructor(props) { super(props); this.state = { step: 'offer', copied: false }; }
renderVals() {
const accent = this.props.accent ?? '#D4FF3A';
const n = 20;
const finder = (r, c) => {
const inBox = (r0, c0) => r >= r0 && r < r0 + 6 && c >= c0 && c < c0 + 6;
const box = inBox(0, 0) ? [0, 0] : inBox(0, n - 6) ? [0, n - 6] : inBox(n - 6, 0) ? [n - 6, 0] : null;
if (!box) return null;
const y = r - box[0], x = c - box[1];
const edge = y === 0 || y === 5 || x === 0 || x === 5;
const core = y >= 2 && y <= 3 && x >= 2 && x <= 3;
return edge || core;
};
const qr = [];
for (let r = 0; r < n; r++) {
for (let c = 0; c < n; c++) {
const f = finder(r, c);
const on = f === null ? ((r * 7 + c * 13 + r * c) % 5 < 2) : f;
qr.push({ style: 'display: block; aspect-ratio: 1; background: ' + (on ? '#0B0B0F' : 'transparent') });
}
}
return {
accent, qr,
price: this.props.price ?? 'R$ 10',
isOffer: this.state.step === 'offer',
isPix: this.state.step === 'pix',
goPix: () => this.setState({ step: 'pix' }),
back: () => this.setState({ step: 'offer', copied: false }),
copy: () => this.setState({ copied: true }),
copyLabel: this.state.copied ? 'Código copiado' : 'Copiar código Pix',
perks: ['Nenhum anúncio, em nenhuma tela', 'Simulados sem pausa', 'Apoia quem cria o conteúdo']
};
}
}
</script>


</body></html>
