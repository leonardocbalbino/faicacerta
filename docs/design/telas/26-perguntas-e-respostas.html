<script type="text/x-dc" data-dc-script="" data-props="{&quot;accent&quot;:{&quot;editor&quot;:&quot;color&quot;,&quot;default&quot;:&quot;#D4FF3A&quot;,&quot;options&quot;:[&quot;#D4FF3A&quot;,&quot;#5B8CFF&quot;,&quot;#FF5C8A&quot;,&quot;#2EE6A8&quot;]},&quot;$preview&quot;:{&quot;width&quot;:390,&quot;height&quot;:844}}">
class Component extends DCLogic {
constructor(props) { super(props); this.state = { asked: ['seiryoku'] }; }
renderVals() {
const accent = this.props.accent ?? '#D4FF3A';
const bank = {
seiryoku: { q: 'O que significa Seiryoku-Zenyo?', a: 'É o princípio da máxima eficiência: usar a energia do corpo e da mente da forma mais eficaz possível.\n\nJunto com o Jita-Kyoei, é um dos dois princípios centrais que Jigoro Kano deu ao judô.', src: 'Guia Kodokan · Princípios' },
jita: { q: 'E Jita-Kyoei?', a: 'Significa prosperidade e benefício mútuos: crescer junto com o outro, não às custas dele. Por isso o judô dá tanto valor ao respeito pelo uke.', src: 'Guia Kodokan · Princípios' },
gokyo: { q: 'O que é o Gokyo?', a: 'É a lista clássica de técnicas de projeção da Kodokan: 40 técnicas em 5 grupos de 8, na ordem em que costumam ser ensinadas.', src: 'Guia Kodokan · Nage-waza' },
fundacao: { q: 'Quando a Kodokan foi fundada?', a: 'Em 1882, em Tóquio, por Jigoro Kano. Ela é considerada a sede mundial do judô.', src: 'Guia Kodokan · História' }
};
const msgs = [];
this.state.asked.slice(-2).forEach((id) => {
const b = bank[id];
msgs.push({ text: b.q, isA: false, source: '', wrap: 'display: flex; justify-content: flex-end', bubble: 'max-width: 80%; border-radius: 18px 18px 6px 18px; background: ' + accent + '; color: #0B0B0F; padding: 10px 14px; font-size: 15px; font-weight: 600; line-height: 1.4; display: flex; flex-direction: column' });
msgs.push({ text: b.a, isA: true, source: b.src, wrap: 'display: flex; justify-content: flex-start', bubble: 'max-width: 88%; border-radius: 18px 18px 18px 6px; background: #16161D; border: 1px solid #26262F; color: #F5F5F7; padding: 14px; font-size: 15px; line-height: 1.5; display: flex; flex-direction: column; gap: 12px' });
});
const suggestions = Object.keys(bank).filter((id) => !this.state.asked.includes(id)).map((id) => ({
label: bank[id].q,
ask: () => this.setState({ asked: [...this.state.asked, id] })
}));
return { accent, msgs, suggestions };
}
}
</script>
