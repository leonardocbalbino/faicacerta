const formats = [['stories', 'Stories 9:16'], ['quadrado', 'Quadrado 1:1']].map(([id, label]) => {

});
const themeList = [['faixa', 'Cor da faixa'], ['escuro', 'Escuro'], ['destaque', 'Destaque']].map(([id, label]) => {
const on = this.state.theme === id;
return { label, on: on ? 'true' : 'false', pick: () => this.setState({ theme: id }), style: 'width: 48px; height: 48px; border-radius: 24px; cursor: pointer; background: ' + themes[id].bg + '; border: 3px solid ' + (on ? '#F5F5F7' : '#26262F') + '; box-shadow: ' + (on ? '0 0 0 3px #0B0B0F inset' : 'none') };
