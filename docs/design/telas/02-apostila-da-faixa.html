<script type="text/x-dc" data-dc-script="" data-props="{&quot;accent&quot;:{&quot;editor&quot;:&quot;color&quot;,&quot;default&quot;:&quot;#D4FF3A&quot;,&quot;options&quot;:[&quot;#D4FF3A&quot;,&quot;#5B8CFF&quot;,&quot;#FF5C8A&quot;,&quot;#2EE6A8&quot;]},&quot;$preview&quot;:{&quot;width&quot;:390,&quot;height&quot;:844}}">
class Component extends DCLogic {
constructor(props) { super(props); this.state = { tab: 'nage' }; }
renderVals() {
const accent = this.props.accent ?? '#D4FF3A';
const defs = [['nage', 'Nage-waza'], ['katame', 'Katame-waza'], ['ukemi', 'Ukemi'], ['termos', 'Termos']];
const tabs = defs.map(([id, label]) => {
const on = this.state.tab === id;
return {
label, selected: on ? 'true' : 'false',
pick: () => this.setState({ tab: id }),
style: 'height: 40px; padding: 0 14px; border-radius: 999px; font: inherit; font-size: 14px; font-weight: 600; cursor: pointer; white-space: nowrap; ' + (on ? 'background: ' + accent + '; color: #0B0B0F; border: 1px solid ' + accent : 'background: #16161D; color: #F5F5F7; border: 1px solid #26262F')
};
});
const badge = {
Domino: 'background: ' + accent + '; color: #0B0B0F',
Estudando: 'background: #2A2A35; color: #F5F5F7',
Novo: 'background: transparent; color: #A1A1AA; border: 1px solid #3A3A46'
};
const raw = [
['O-soto-gari', 'Ashi-waza', 'Domino'],
['O-uchi-gari', 'Ashi-waza', 'Domino'],
['Ko-uchi-gari', 'Ashi-waza', 'Estudando'],
['Ippon-seoi-nage', 'Te-waza', 'Domino'],
['Uki-goshi', 'Koshi-waza', 'Estudando'],
['O-goshi', 'Koshi-waza', 'Novo'],
['Tai-otoshi', 'Te-waza', 'Novo']
];
const items = raw.map(([name, group, status], i) => ({
n: String(i + 1).padStart(2, '0'), name, group, status,
badgeStyle: 'font-size: 11px; font-weight: 700; padding: 5px 9px; border-radius: 999px; ' + badge[status]
}));
return { accent, tabs, items };
}
}
</script>
