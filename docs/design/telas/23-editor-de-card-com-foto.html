</header>

<div style="width: 236px; height: 420px; border-radius: 22px; position: relative; overflow: hidden; background: #3A3F47; color: #FFFFFF; box-shadow: 0 20px 60px #00000099">
<div aria-hidden="true" style="position: absolute; top: 150px; left: 0; right: 0; display: flex; flex-direction: column; align-items: center; gap: 6px; color: #FFFFFF66; font-size: 11px"><svg width="28" height="28" sc-camel-view-box="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8h3l2-3h6l2 3h3v11H4z"></path><circle cx="12" cy="13" r="3.5"></circle></svg>Sua foto</div>

<sc-if value="{{isClassico}}" hint-placeholder-val="{{ true }}">

<span style="font-family: 'Bricolage Grotesque', sans-serif; font-size: 36px; font-weight: 800; line-height: 0.9; text-transform: uppercase">Faixa<br>laranja</span>
<div style="display: flex; gap: 14px">
<sc-for list="{{shown}}" as="s" hint-placeholder-count="3">

</div>
</div>
</sc-if>

<div role="radiogroup" aria-label="Modelo" style="align-self: stretch; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px">
<sc-for list="{{tpls}}" as="t" hint-placeholder-count="3">
<button role="radio" aria-checked="{{t.checked}}" sc-camel-on-click="{{t.pick}}" style="{{t.style}}">{{t.label}}</button>
</sc-for>
</div>
<div role="group" aria-label="Dados no card" style="align-self: stretch; display: flex; gap: 8px">
<sc-for list="{{stats}}" as="s" hint-placeholder-count="3">
<button aria-pressed="{{s.on}}" sc-camel-on-click="{{s.toggle}}" style="{{s.style}}">{{s.label}}</button>
</sc-for>
</div>
</div>
<div style="position: absolute; left: 0; right: 0; bottom: 0; padding: 12px 20px 30px; display: flex; gap: 10px">
<button style="flex: 1; height: 54px; border-radius: 16px; border: 1px solid #3A3A46; background: transparent; color: #F5F5F7; font: inherit; font-size: 15px; font-weight: 600; cursor: pointer">Salvar</button>
<button style="flex: 1; height: 54px; border-radius: 16px; border: 0; background: {{accent}}; color: #0B0B0F; font: inherit; font-size: 15px; font-weight: 700; cursor: pointer">Postar nos stories</button>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script="" data-props="{&quot;accent&quot;:{&quot;editor&quot;:&quot;color&quot;,&quot;default&quot;:&quot;#D4FF3A&quot;,&quot;options&quot;:[&quot;#D4FF3A&quot;,&quot;#5B8CFF&quot;,&quot;#FF5C8A&quot;,&quot;#2EE6A8&quot;]},&quot;$preview&quot;:{&quot;width&quot;:390,&quot;height&quot;:844}}">
class Component extends DCLogic {
constructor(props) { super(props); this.state = { tpl: 'classico', on: { treinos: true, tecnicas: true, tempo: true } }; }
renderVals() {
const accent = this.props.accent ?? '#D4FF3A';
const tpls = [['classico', 'Clássico'], ['diagonal', 'Diagonal'], ['topo', 'Dados no topo']].map(([id, label]) => {
const on = this.state.tpl === id;
return { label, checked: on ? 'true' : 'false', pick: () => this.setState({ tpl: id }), style: 'height: 44px; border-radius: 14px; font: inherit; font-size: 13px; font-weight: 600; cursor: pointer; ' + (on ? 'background: ' + accent + '; color: #0B0B0F; border: 1px solid ' + accent : 'background: #16161D; color: #F5F5F7; border: 1px solid #26262F') };
});
const defs = [['treinos', 'Treinos', '112'], ['tecnicas', 'Técnicas', '29'], ['tempo', 'Na faixa', '9 m']];
const stats = defs.map(([id, label]) => {
const on = !!this.state.on[id];
return { label, on: on ? 'true' : 'false', toggle: () => this.setState({ on: { ...this.state.on, [id]: !on } }), style: 'flex: 1; height: 40px; border-radius: 999px; font: inherit; font-size: 13px; font-weight: 600; cursor: pointer; ' + (on ? 'background: #F5F5F7; color: #0B0B0F; border: 1px solid #F5F5F7' : 'background: transparent; color: #A1A1AA; border: 1px dashed #3A3A46') };
});
const shown = defs.filter(([id]) => this.state.on[id]).map(([, label, value]) => ({ label, value }));
return {
accent, tpls, stats, shown,
isClassico: this.state.tpl === 'classico',
isDiagonal: this.state.tpl === 'diagonal',
isTopo: this.state.tpl === 'topo'
};
}
}
</script>


</body></html>
