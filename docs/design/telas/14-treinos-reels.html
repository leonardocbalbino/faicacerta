<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #000000; color: #F5F5F7; font-family: Inter, system-ui, sans-serif">

<button aria-label="Próximo vídeo" sc-camel-on-click="{{next}}" style="position: absolute; inset: 0; border: 0; padding: 0; background: {{video.bg}}; cursor: pointer; display: flex; align-items: center; justify-content: center">
<span aria-hidden="true" style="position: absolute; inset: 0; background-image: radial-gradient(#FFFFFF14 1px, transparent 1px); background-size: 16px 16px"></span>
<span style="position: relative; display: flex; flex-direction: column; align-items: center; gap: 10px; color: #FFFFFF99; font: inherit; font-size: 13px">
<svg aria-hidden="true" width="40" height="40" sc-camel-view-box="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="6" y="2" width="12" height="20" rx="3"></rect><path d="m10.5 9 4 3-4 3z"></path></svg>
Vídeo vertical do treino
</span>
</button>

<div aria-hidden="true" style="position: absolute; left: 0; right: 0; bottom: 0; height: 420px; background: linear-gradient(to top, #000000E6 0%, #000000B3 45%, #00000000 100%); pointer-events: none"></div>
<div aria-hidden="true" style="position: absolute; left: 0; right: 0; top: 0; height: 140px; background: linear-gradient(to bottom, #00000099, #00000000); pointer-events: none"></div>

<header style="position: absolute; top: 54px; left: 16px; right: 16px; display: flex; align-items: center; justify-content: space-between">
<span style="width: 44px"></span>
<div role="tablist" aria-label="Feed" style="display: flex; gap: 18px">
<sc-for list="{{feeds}}" as="f" hint-placeholder-count="2">
<button role="tab" aria-selected="{{f.selected}}" sc-camel-on-click="{{f.pick}}" style="{{f.style}}">{{f.label}}</button>
</sc-for>
</div>
<a href="PostarTreino.dc.html" aria-label="Postar vídeo do treino" style="width: 44px; height: 44px; border-radius: 14px; background: #FFFFFF26; color: #FFFFFF; display: flex; align-items: center; justify-content: center"><svg aria-hidden="true" width="22" height="22" sc-camel-view-box="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14"></path><path d="M5 12h14"></path></svg></a>
</header>

<div style="position: absolute; right: 12px; bottom: 150px; display: flex; flex-direction: column; align-items: center; gap: 18px">
<div style="position: relative; margin-bottom: 6px">
<span aria-hidden="true" style="width: 48px; height: 48px; border-radius: 24px; background: #F5F5F7; color: #0B0B0F; border: 2px solid #FFFFFF; display: flex; align-items: center; justify-content: center; font-family: 'Bricolage Grotesque', sans-serif; font-weight: 800">{{video.initials}}</span>
<span aria-hidden="true" style="position: absolute; left: 50%; bottom: -8px; margin-left: -10px; width: 20px; height: 20px; border-radius: 10px; background: {{accent}}; color: #0B0B0F; display: flex; align-items: center; justify-content: center; font-size: 14px; font-weight: 800; line-height: 1">+</span>
</div>
<button aria-label="Curtir" aria-pressed="{{likedStr}}" sc-camel-on-click="{{toggleLike}}" style="border: 0; background: transparent; color: #FFFFFF; display: flex; flex-direction: column; align-items: center; gap: 4px; font: inherit; font-size: 12px; font-weight: 600; cursor: pointer; min-width: 48px">
<svg aria-hidden="true" width="32" height="32" sc-camel-view-box="0 0 24 24" fill="{{likeFill}}" stroke="{{likeStroke}}" stroke-width="1.8" stroke-linejoin="round"><path d="M12 20s-7-4.4-7-10a4 4 0 0 1 7-2.6A4 4 0 0 1 19 10c0 5.6-7 10-7 10z"></path></svg>{{likes}}</button>
<button aria-label="Comentários" style="border: 0; background: transparent; color: #FFFFFF; display: flex; flex-direction: column; align-items: center; gap: 4px; font: inherit; font-size: 12px; font-weight: 600; cursor: pointer; min-width: 48px">
<svg aria-hidden="true" width="30" height="30" sc-camel-view-box="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="M4 5h16v11H9l-5 4z"></path></svg>{{video.comments}}</button>
<button aria-label="Salvar" aria-pressed="{{savedStr}}" sc-camel-on-click="{{toggleSave}}" style="border: 0; background: transparent; color: #FFFFFF; display: flex; flex-direction: column; align-items: center; gap: 4px; font: inherit; font-size: 12px; font-weight: 600; cursor: pointer; min-width: 48px">
<svg aria-hidden="true" width="30" height="30" sc-camel-view-box="0 0 24 24" fill="{{saveFill}}" stroke="{{saveStroke}}" stroke-width="1.8" stroke-linejoin="round"><path d="M6 3h12v18l-6-4-6 4z"></path></svg>Salvar</button>
<button aria-label="Compartilhar" style="border: 0; background: transparent; color: #FFFFFF; display: flex; flex-direction: column; align-items: center; gap: 4px; font: inherit; font-size: 12px; font-weight: 600; cursor: pointer; min-width: 48px">
<svg aria-hidden="true" width="30" height="30" sc-camel-view-box="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="m21 3-9 9"></path><path d="M21 3 14 21l-3-8-8-3z"></path></svg>Enviar</button>

<script type="text/x-dc" data-dc-script="" data-props="{&quot;accent&quot;:{&quot;editor&quot;:&quot;color&quot;,&quot;default&quot;:&quot;#D4FF3A&quot;,&quot;options&quot;:[&quot;#D4FF3A&quot;,&quot;#5B8CFF&quot;,&quot;#FF5C8A&quot;,&quot;#2EE6A8&quot;]},&quot;$preview&quot;:{&quot;width&quot;:390,&quot;height&quot;:844}}">
class Component extends DCLogic {
constructor(props) { super(props); this.state = { feed: 'turma', idx: 0, liked: {}, saved: {}, speed: 2 }; }
renderVals() {
const accent = this.props.accent ?? '#D4FF3A';
const videos = [
{ author: 'Sensei Ricardo', initials: 'RS', tag: 'PROFESSOR', tagBg: accent, tagColor: '#0B0B0F', caption: 'Entrada de O-soto-gari a partir da pegada cruzada. Repare no pé de apoio antes de ceifar.', technique: 'O-soto-gari', belt: 'Faixa laranja', beltColor: '#FB923C', likes: 128, comments: 14, bg: '#1C1A24', progress: '38%' },
{ author: 'Ana Lima', initials: 'AL', tag: 'ALUNA', tagBg: '#FFFFFF26', tagColor: '#FFFFFF', caption: 'Treino de uchi-komi de hoje: 3 séries de 10. Corrigindo a rotação do quadril.', technique: 'Ippon-seoi-nage', belt: 'Faixa amarela', beltColor: '#FACC15', likes: 47, comments: 6, bg: '#14202A', progress: '64%' },
{ author: 'Sensei Ricardo', initials: 'RS', tag: 'PROFESSOR', tagBg: accent, tagColor: '#0B0B0F', caption: 'Saída de kesa-gatame: ponte e giro para o lado da cabeça do uke.', technique: 'Kesa-gatame', belt: 'Faixa amarela', beltColor: '#FACC15', likes: 212, comments: 31, bg: '#221A16', progress: '12%' }
];
const v = videos[this.state.idx];
const liked = !!this.state.liked[this.state.idx];
const saved = !!this.state.saved[this.state.idx];
const speeds = ['0,25x', '0,5x', '1x'];
const feeds = [['turma', 'Minha turma'], ['todos', 'Para você']].map(([id, label]) => {
const on = this.state.feed === id;
return { label, selected: on ? 'true' : 'false', pick: () => this.setState({ feed: id }), style: 'border: 0; background: transparent; padding: 10px 0; font: inherit; font-size: 16px; cursor: pointer; ' + (on ? 'color: #FFFFFF; font-weight: 700; box-shadow: inset 0 -2px 0 #FFFFFF' : 'color: #FFFFFFA6; font-weight: 600') };
});
return {
accent, feeds,
video: v,
next: () => this.setState({ idx: (this.state.idx + 1) % videos.length }),
likes: String(v.likes + (liked ? 1 : 0)),
likedStr: liked ? 'true' : 'false',
likeFill: liked ? '#FF5C7A' : 'none',
likeStroke: liked ? '#FF5C7A' : '#FFFFFF',
toggleLike: () => this.setState({ liked: { ...this.state.liked, [this.state.idx]: !liked } }),
savedStr: saved ? 'true' : 'false',
saveFill: saved ? accent : 'none',
saveStroke: saved ? accent : '#FFFFFF',
toggleSave: () => this.setState({ saved: { ...this.state.saved, [this.state.idx]: !saved } }),
speed: speeds[this.state.speed],
cycleSpeed: () => this.setState({ speed: (this.state.speed + 1) % 3 })
};
}
}
</script>
