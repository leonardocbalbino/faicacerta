<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #0B0B0F; color: #F5F5F7; font-family: Inter, system-ui, sans-serif">
<div style="padding: 60px 20px 0; display: flex; flex-direction: column; gap: 16px">
<header style="display: flex; align-items: center; justify-content: space-between">
<div style="display: flex; flex-direction: column; gap: 4px">
<span style="font-size: 12px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: #A1A1AA">Modo professor</span>
<button style="padding: 0; border: 0; background: transparent; color: #F5F5F7; font-family: 'Bricolage Grotesque', sans-serif; font-size: 26px; font-weight: 800; display: flex; align-items: center; gap: 6px; cursor: pointer">Adulto Noite<svg aria-hidden="true" width="20" height="20" sc-camel-view-box="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"></path></svg></button>
</div>
<button aria-label="Convidar alunos por QR code" style="width: 48px; height: 48px; border-radius: 16px; border: 0; background: {{accent}}; color: #0B0B0F; display: flex; align-items: center; justify-content: center; cursor: pointer"><svg aria-hidden="true" width="22" height="22" sc-camel-view-box="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7" rx="1"></rect><rect x="14" y="3" width="7" height="7" rx="1"></rect><rect x="3" y="14" width="7" height="7" rx="1"></rect><path d="M14 14h3v3h-3z"></path><path d="M20 14v.01"></path><path d="M14 20h.01"></path><path d="M17 20h4v-3"></path></svg></button>
</header>

<div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px">
<div style="border-radius: 18px; background: #16161D; border: 1px solid #26262F; padding: 12px; display: flex; flex-direction: column; gap: 2px"><span style="font-family: 'Bricolage Grotesque', sans-serif; font-size: 26px; font-weight: 800">24</span><span style="font-size: 12px; color: #A1A1AA">alunos</span></div>
<div style="border-radius: 18px; background: {{accent}}; color: #0B0B0F; padding: 12px; display: flex; flex-direction: column; gap: 2px"><span style="font-family: 'Bricolage Grotesque', sans-serif; font-size: 26px; font-weight: 800">9</span><span style="font-size: 12px; font-weight: 600">prontos p/ exame</span></div>
<div style="border-radius: 18px; background: #2A1A1E; padding: 12px; display: flex; flex-direction: column; gap: 2px"><span style="font-family: 'Bricolage Grotesque', sans-serif; font-size: 26px; font-weight: 800; color: #FF8FA8">3</span><span style="font-size: 12px; color: #FFC2CF">sem estudar há 7d</span></div>
</div>

<div style="display: flex; gap: 8px">
<sc-for list="{{chips}}" as="c" hint-placeholder-count="3">
<button sc-camel-on-click="{{c.pick}}" aria-pressed="{{c.on}}" style="{{c.style}}">{{c.label}}</button>
</sc-for>
</div>

<ul style="list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px">
<sc-for list="{{students}}" as="s" hint-placeholder-count="6">
<li style="border-radius: 18px; background: #16161D; border: 1px solid #26262F; padding: 12px 14px; display: flex; align-items: center; gap: 12px">
<span aria-hidden="true" style="width: 40px; height: 40px; border-radius: 20px; background: #1F1F29; display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 700">{{s.initials}}</span>
<span style="flex: 1; display: flex; flex-direction: column; gap: 6px">
<span style="display: flex; align-items: center; gap: 8px"><span style="font-size: 15px; font-weight: 600">{{s.name}}</span><span style="{{s.belt}}"></span></span>
<span style="height: 6px; border-radius: 3px; background: #26262F; overflow: hidden"><span style="{{s.bar}}"></span></span>
</span>
<span style="font-size: 14px; font-weight: 700; font-variant-numeric: tabular-nums; min-width: 40px; text-align: right">{{s.pct}}</span>
</li>
</sc-for>
</ul>
</div>

<script type="text/x-dc" data-dc-script="" data-props="{&quot;accent&quot;:{&quot;editor&quot;:&quot;color&quot;,&quot;default&quot;:&quot;#D4FF3A&quot;,&quot;options&quot;:[&quot;#D4FF3A&quot;,&quot;#5B8CFF&quot;,&quot;#FF5C8A&quot;,&quot;#2EE6A8&quot;]},&quot;$preview&quot;:{&quot;width&quot;:390,&quot;height&quot;:844}}">
class Component extends DCLogic {
constructor(props) { super(props); this.state = { chip: 'Todos' }; }
renderVals() {
const accent = this.props.accent ?? '#D4FF3A';
const chips = ['Todos', 'Prontos', 'Precisam de atenção'].map((label) => {
const on = this.state.chip === label;
return { label, on: on ? 'true' : 'false', pick: () => this.setState({ chip: label }), style: 'height: 40px; padding: 0 14px; border-radius: 999px; font: inherit; font-size: 13px; font-weight: 600; cursor: pointer; white-space: nowrap; ' + (on ? 'background: #F5F5F7; color: #0B0B0F; border: 1px solid #F5F5F7' : 'background: #16161D; color: #F5F5F7; border: 1px solid #26262F') };
});
const raw = [
['Ana Lima', 'AL', '#FACC15', 92], ['Lucas Moura', 'LM', '#FACC15', 62], ['Bia Costa', 'BC', '#FB923C', 88],
['Caio Reis', 'CR', '#F5F5F7', 34], ['Davi Nunes', 'DN', '#22C55E', 75], ['Júlia Prado', 'JP', '#FACC15', 18]
];
let list = raw;
if (this.state.chip === 'Prontos') list = raw.filter((r) => r[3] >= 80);
if (this.state.chip === 'Precisam de atenção') list = raw.filter((r) => r[3] < 40);
const students = list.map(([name, initials, belt, p]) => ({
name, initials, pct: p + '%',
belt: 'width: 22px; height: 8px; border-radius: 3px; background: ' + belt,
bar: 'display: block; height: 100%; width: ' + p + '%; border-radius: 3px; background: ' + (p >= 80 ? accent : p < 40 ? '#FF5C7A' : '#F5F5F7')
}));
return { accent, chips, students };
}
}
</script>
