<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #0B0B0F; color: #F5F5F7; font-family: Inter, system-ui, sans-serif">
<div style="padding: 60px 20px 0; display: flex; flex-direction: column; gap: 22px">
<div style="display: flex; align-items: center; justify-content: space-between">
<div aria-label="Passo 2 de 3" style="display: flex; gap: 6px">
<span style="width: 28px; height: 6px; border-radius: 3px; background: {{accent}}"></span>
<span style="width: 28px; height: 6px; border-radius: 3px; background: {{accent}}"></span>
<span style="width: 28px; height: 6px; border-radius: 3px; background: #26262F"></span>
</div>
<a href="Main.dc.html" style="font-size: 14px; font-weight: 600; color: #A1A1AA; text-decoration: none; min-height: 44px; display: flex; align-items: center">Pular</a>
</div>
<div style="display: flex; flex-direction: column; gap: 10px">
<h1 style="margin: 0; font-family: 'Bricolage Grotesque', sans-serif; font-size: 36px; font-weight: 800; line-height: 1.05">Qual é a sua faixa hoje?</h1>
<p style="margin: 0; font-size: 15px; line-height: 1.5; color: #A1A1AA">A gente monta a apostila da próxima faixa para você.</p>
</div>
<div role="radiogroup" aria-label="Faixa atual" style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px">
<sc-for list="{{belts}}" as="b" hint-placeholder-count="10">
<button role="radio" aria-checked="{{b.checked}}" sc-camel-on-click="{{b.pick}}" style="{{b.style}}">
<span style="{{b.swatch}}"></span>
<span style="flex: 1; text-align: left">{{b.name}}</span>
</button>
</sc-for>
</div>
</div>
<div style="position: absolute; left: 0; right: 0; bottom: 0; padding: 12px 20px 30px">
<a href="Login.dc.html" style="height: 56px; border-radius: 18px; background: {{accent}}; color: #0B0B0F; text-decoration: none; font-size: 17px; font-weight: 700; display: flex; align-items: center; justify-content: center">Continuar</a>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script="" data-props="{&quot;accent&quot;:{&quot;editor&quot;:&quot;color&quot;,&quot;default&quot;:&quot;#D4FF3A&quot;,&quot;options&quot;:[&quot;#D4FF3A&quot;,&quot;#5B8CFF&quot;,&quot;#FF5C8A&quot;,&quot;#2EE6A8&quot;]},&quot;$preview&quot;:{&quot;width&quot;:390,&quot;height&quot;:844}}">
class Component extends DCLogic {
constructor(props) { super(props); this.state = { picked: 'Amarela' }; }
renderVals() {
const accent = this.props.accent ?? '#D4FF3A';
const list = [
['Branca', '#F5F5F7', ''], ['Cinza', '#9CA3AF', ''], ['Azul', '#3B82F6', ''], ['Amarela', '#FACC15', ''],
['Laranja', '#FB923C', ''], ['Verde', '#22C55E', ''], ['Roxa', '#A855F7', ''], ['Marrom', '#92400E', ''],
['Preta', '#0B0B0F', 'border: 1px solid #5A5A66;'], ['Ainda não treino', 'transparent', 'border: 1.5px dashed #5A5A66;']
];
const belts = list.map(([name, color, extra]) => {
const on = this.state.picked === name;
return {
name, checked: on ? 'true' : 'false',
pick: () => this.setState({ picked: name }),
style: 'height: 60px; border-radius: 18px; padding: 0 14px; display: flex; align-items: center; gap: 12px; font: inherit; font-size: 15px; font-weight: 600; color: #F5F5F7; cursor: pointer; background: ' + (on ? '#1F1F29' : '#16161D') + '; border: 2px solid ' + (on ? accent : '#26262F'),
swatch: 'width: 32px; height: 14px; border-radius: 4px; flex: none; background: ' + color + ';' + extra
};
});
return { accent, belts };
}
}
</script>
