<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #0B0B0F; color: #F5F5F7; font-family: Inter, system-ui, sans-serif">
<div style="padding: 60px 20px 0; display: flex; flex-direction: column; gap: 16px">

<header style="display: flex; align-items: center; gap: 12px">
<div aria-hidden="true" style="width: 52px; height: 52px; border-radius: 18px; background: #F5F5F7; color: #0B0B0F; display: flex; align-items: center; justify-content: center; font-family: 'Bricolage Grotesque', sans-serif; font-size: 20px; font-weight: 800">RS</div>
<div style="flex: 1; display: flex; flex-direction: column; gap: 2px">
<h1 style="margin: 0; font-family: 'Bricolage Grotesque', sans-serif; font-size: 22px; font-weight: 800">Turma Adulto Noite</h1>
<span style="font-size: 13px; color: #A1A1AA">Sensei Ricardo · 24 alunos</span>
</div>
<span style="font-size: 11px; font-weight: 700; padding: 5px 9px; border-radius: 999px; background: {{accent}}; color: #0B0B0F">PRO</span>
</header>

<div style="border-radius: 20px; background: #16161D; border: 1px solid #26262F; padding: 14px 16px; display: flex; align-items: center; gap: 14px">
<div style="width: 52px; height: 56px; border-radius: 14px; background: #0B0B0F; display: flex; flex-direction: column; align-items: center; justify-content: center"><span style="font-family: 'Bricolage Grotesque', sans-serif; font-size: 22px; font-weight: 800; line-height: 1">06</span><span style="font-size: 11px; color: #A1A1AA">dez</span></div>
<div style="flex: 1; display: flex; flex-direction: column; gap: 2px"><span style="font-size: 15px; font-weight: 700">Exame de faixa</span><span style="font-size: 13px; color: #A1A1AA">Sábado, 9h · faltam 12 dias</span></div>
<svg aria-hidden="true" width="20" height="20" sc-camel-view-box="0 0 24 24" fill="none" stroke="#A1A1AA" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m9 5 7 7-7 7"></path></svg>
</div>

<div role="tablist" aria-label="Seções da turma" style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 4px; padding: 4px; border-radius: 16px; background: #16161D; border: 1px solid #26262F">
<sc-for list="{{tabs}}" as="t" hint-placeholder-count="3">
<button role="tab" aria-selected="{{t.selected}}" sc-camel-on-click="{{t.pick}}" style="{{t.style}}">{{t.label}}</button>
</sc-for>
</div>

<sc-if value="{{isLoja}}" hint-placeholder-val="{{ true }}">
<div style="display: flex; flex-direction: column; gap: 12px">
<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px">
<sc-for list="{{products}}" as="p" hint-placeholder-count="4">
<button style="border-radius: 20px; background: #16161D; border: 1px solid #26262F; padding: 8px; display: flex; flex-direction: column; gap: 8px; color: #F5F5F7; font: inherit; text-align: left; cursor: pointer">
<span style="height: 104px; border-radius: 14px; background: {{p.tint}}; display: flex; align-items: center; justify-content: center; color: #0B0B0F"><svg aria-hidden="true" width="34" height="34" sc-camel-view-box="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M8 3 4 6l2 4 2-1v12h8V9l2 1 2-4-4-3-2 2h-4z"></path></svg></span>
<span style="padding: 0 4px; display: flex; flex-direction: column; gap: 2px"><span style="font-size: 14px; font-weight: 600">{{p.name}}</span><span style="font-size: 12px; color: #A1A1AA">{{p.meta}}</span></span>
<span style="padding: 0 4px 4px; font-family: 'Bricolage Grotesque', sans-serif; font-size: 18px; font-weight: 800">{{p.price}}</span>
</button>
</sc-for>
</div>
<div style="border-radius: 14px; background: #10251E; padding: 12px 14px; display: flex; gap: 10px; align-items: center; font-size: 13px; line-height: 1.35; color: #B7F5DE"><svg aria-hidden="true" width="20" height="20" sc-camel-view-box="0 0 24 24" fill="none" stroke="#2EE6A8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="flex: none"><path d="m12 2 4 4-4 4-4-4z"></path><path d="m18 8 4 4-4 4-4-4z"></path><path d="m6 8 4 4-4 4-4-4z"></path><path d="m12 14 4 4-4 4-4-4z"></path></svg>Pagamento por Pix direto para o professor. Sem taxas.</div>
</div>
</sc-if>

<sc-if value="{{isMaterial}}" hint-placeholder-val="{{ false }}">
<ul style="list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px">
<sc-for list="{{modules}}" as="m" hint-placeholder-count="4">
<li style="height: 64px; border-radius: 18px; background: #16161D; border: 1px solid #26262F; padding: 0 14px; display: flex; align-items: center; gap: 12px">
<span style="width: 40px; height: 40px; border-radius: 12px; background: #1F1F29; display: flex; align-items: center; justify-content: center; font-family: 'Bricolage Grotesque', sans-serif; font-weight: 800; color: {{accent}}">{{m.n}}</span>

class Component extends DCLogic {
constructor(props) { super(props); this.state = { tab: 'loja' }; }
renderVals() {
const accent = this.props.accent ?? '#D4FF3A';
const tabs = [['material', 'Material'], ['avisos', 'Avisos'], ['loja', 'Lojinha']].map(([id, label]) => {
const on = this.state.tab === id;
return {
label, selected: on ? 'true' : 'false',
pick: () => this.setState({ tab: id }),
style: 'height: 40px; border-radius: 12px; border: 0; font: inherit; font-size: 14px; font-weight: 600; cursor: pointer; ' + (on ? 'background: #F5F5F7; color: #0B0B0F' : 'background: transparent; color: #A1A1AA')
};
});
return {
accent, tabs,
isLoja: this.state.tab === 'loja',
isMaterial: this.state.tab === 'material',
isAvisos: this.state.tab === 'avisos',
products: [
{ name: 'Judogi branco', meta: 'A1 a A4', price: 'R$ 289,90', tint: '#F5F5F7' },
{ name: 'Faixa laranja', meta: 'Algodão', price: 'R$ 39,90', tint: '#FB923C' },
{ name: 'Camiseta da equipe', meta: 'P a GG', price: 'R$ 69,90', tint: '#5B8CFF' },
{ name: 'Taxa de exame', meta: '06 dez', price: 'R$ 80,00', tint: accent }
],
modules: [
{ n: '1', name: 'Revisão do exame', meta: '8 técnicas · 2 vídeos do sensei' },
{ n: '2', name: 'Ne-waza da semana', meta: '3 técnicas' },
{ n: '3', name: 'Preparação física', meta: '4 vídeos' },
{ n: '4', name: 'Terminologia', meta: '20 termos' }
],
notices: [
{ when: 'Hoje, 18:40', text: 'Treino extra de revisão na quinta, 20h.' },
{ when: 'Ontem', text: 'Tragam o judogi branco para o exame.' },
{ when: '18 nov', text: 'Inscrições do campeonato abertas na lojinha.' }
]
};
}
}
</script>
