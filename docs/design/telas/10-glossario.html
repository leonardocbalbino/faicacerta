<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #0B0B0F; color: #F5F5F7; font-family: Inter, system-ui, sans-serif">
<div style="padding: 60px 20px 0; display: flex; flex-direction: column; gap: 16px">
<header style="display: flex; align-items: center; gap: 12px">
<a href="Main.dc.html" aria-label="Voltar" style="width: 44px; height: 44px; border-radius: 14px; border: 1px solid #26262F; background: #16161D; color: #F5F5F7; display: flex; align-items: center; justify-content: center"><svg aria-hidden="true" width="20" height="20" sc-camel-view-box="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 5-7 7 7 7"></path></svg></a>
<h1 style="margin: 0; font-family: 'Bricolage Grotesque', sans-serif; font-size: 30px; font-weight: 800">Glossário</h1>
</header>
<label style="height: 48px; border-radius: 14px; background: #16161D; border: 1px solid #26262F; display: flex; align-items: center; gap: 10px; padding: 0 14px; color: #A1A1AA">
<svg aria-hidden="true" width="20" height="20" sc-camel-view-box="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-3.5-3.5"></path></svg>
<span style="position: absolute; left: -9999px">Buscar termo</span>
<input type="search" placeholder="Buscar em japonês ou português" style="flex: 1; background: transparent; border: 0; outline: none; color: #F5F5F7; font: inherit; font-size: 15px">
</label>
<div style="display: flex; gap: 8px">
<sc-for list="{{chips}}" as="c" hint-placeholder-count="4">
<button sc-camel-on-click="{{c.pick}}" aria-pressed="{{c.on}}" style="{{c.style}}">{{c.label}}</button>
</sc-for>
</div>
<ul style="list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px">
<sc-for list="{{terms}}" as="t" hint-placeholder-count="8">
<li style="min-height: 60px; border-radius: 18px; background: #16161D; border: 1px solid #26262F; padding: 8px 8px 8px 16px; display: flex; align-items: center; gap: 12px">
<span style="flex: 1; display: flex; flex-direction: column; gap: 2px">
<span style="font-family: 'Bricolage Grotesque', sans-serif; font-size: 18px; font-weight: 800">{{t.jp}}</span>
<span style="font-size: 13px; color: #A1A1AA">{{t.pt}}</span>
</span>
<button aria-label="{{t.aria}}" sc-camel-on-click="{{t.play}}" style="{{t.btn}}"><svg aria-hidden="true" width="20" height="20" sc-camel-view-box="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9v6h4l5 4V5L8 9z"></path><path d="M16.5 8.5a5 5 0 0 1 0 7"></path></svg></button>
</li>
</sc-for>
</ul>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script="" data-props="{&quot;accent&quot;:{&quot;editor&quot;:&quot;color&quot;,&quot;default&quot;:&quot;#D4FF3A&quot;,&quot;options&quot;:[&quot;#D4FF3A&quot;,&quot;#5B8CFF&quot;,&quot;#FF5C8A&quot;,&quot;#2EE6A8&quot;]},&quot;$preview&quot;:{&quot;width&quot;:390,&quot;height&quot;:844}}">
class Component extends DCLogic {
constructor(props) { super(props); this.state = { chip: 'Comandos', playing: 'Hajime' }; }
renderVals() {
const accent = this.props.accent ?? '#D4FF3A';
const chips = ['Todos', 'Comandos', 'Pontuação', 'Pessoas'].map((label) => {
const on = this.state.chip === label;
return {
label, on: on ? 'true' : 'false',
pick: () => this.setState({ chip: label }),
style: 'height: 40px; padding: 0 14px; border-radius: 999px; font: inherit; font-size: 14px; font-weight: 600; cursor: pointer; ' + (on ? 'background: ' + accent + '; color: #0B0B0F; border: 1px solid ' + accent : 'background: #16161D; color: #F5F5F7; border: 1px solid #26262F')
};
});
const raw = [
['Rei', 'Saudação, cumprimento'],
['Hajime', 'Começar'],
['Matte', 'Parar, esperar'],
['Sore-made', 'Fim do combate'],
['Osaekomi', 'Imobilização em andamento'],
['Toketa', 'Imobilização desfeita'],
['Ippon', 'Ponto completo, vitória'],
['Waza-ari', 'Pontuação técnica parcial'],
['Tori', 'Quem aplica a técnica']
];
const terms = raw.map(([jp, pt]) => {
const on = this.state.playing === jp;
return {
jp, pt, aria: 'Ouvir pronúncia de ' + jp,
play: () => this.setState({ playing: jp }),
btn: 'width: 44px; height: 44px; border-radius: 14px; border: 0; display: flex; align-items: center; justify-content: center; cursor: pointer; ' + (on ? 'background: ' + accent + '; color: #0B0B0F' : 'background: #1F1F29; color: #F5F5F7')
};
});
return { accent, chips, terms };
}
}
</script>
