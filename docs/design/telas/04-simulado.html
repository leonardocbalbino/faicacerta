<script type="text/x-dc" data-dc-script="" data-props="{&quot;accent&quot;:{&quot;editor&quot;:&quot;color&quot;,&quot;default&quot;:&quot;#D4FF3A&quot;,&quot;options&quot;:[&quot;#D4FF3A&quot;,&quot;#5B8CFF&quot;,&quot;#FF5C8A&quot;,&quot;#2EE6A8&quot;]},&quot;$preview&quot;:{&quot;width&quot;:390,&quot;height&quot;:844}}">
class Component extends DCLogic {
constructor(props) { super(props); this.state = { picked: null }; }
renderVals() {
const accent = this.props.accent ?? '#D4FF3A';
const correct = 'O-soto-gari';
const picked = this.state.picked;
const bars = Array.from({ length: 10 }, (_, i) => ({
style: 'height: 6px; border-radius: 3px; background: ' + (i < 3 ? accent : i === 3 ? '#F5F5F7' : '#26262F')
}));
const labels = ['O-uchi-gari', 'O-soto-gari', 'Ko-soto-gari', 'De-ashi-barai'];
const options = labels.map((label, i) => {
const isPicked = picked === label;
const isRight = label === correct;
let border = '#26262F', bg = '#16161D', tag = '', letterBg = '#26262F', letterColor = '#F5F5F7';
if (picked) {
if (isRight) { border = '#2EE6A8'; bg = '#10251E'; tag = 'Correta'; letterBg = '#2EE6A8'; letterColor = '#0B0B0F'; }
else if (isPicked) { border = '#FF5C7A'; bg = '#2A1A1E'; tag = 'Sua resposta'; letterBg = '#FF5C7A'; letterColor = '#0B0B0F'; }
}
return {
label, letter: 'ABCD'[i], tag, checked: isPicked ? 'true' : 'false',
pick: () => { if (!this.state.picked) this.setState({ picked: label }); },
style: 'min-height: 58px; border-radius: 18px; border: 1.5px solid ' + border + '; background: ' + bg + '; color: #F5F5F7; font: inherit; font-size: 16px; font-weight: 600; padding: 0 14px; display: flex; align-items: center; gap: 12px; cursor: pointer',
letterStyle: 'width: 30px; height: 30px; border-radius: 10px; display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 700; background: ' + letterBg + '; color: ' + letterColor
};
});
return {
accent, bars, options,
nextLabel: picked ? 'Próxima pergunta' : 'Escolha uma resposta',
nextStyle: 'flex: 1; height: 54px; border-radius: 16px; border: 0; font: inherit; font-size: 16px; font-weight: 700; cursor: pointer; ' + (picked ? 'background: ' + accent + '; color: #0B0B0F' : 'background: #1F1F29; color: #A1A1AA')
};
}
}
