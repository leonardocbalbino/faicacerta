# Site do nginx da VPS (/etc/nginx/sites-available/faixa-certa).
# Atrás do Cloudflare (SSL "Full (strict)"). A porta 80 atende o desafio do Let's Encrypt
# e redireciona o resto para HTTPS.
server {
    listen 80;
    listen [::]:80;
    server_name app-faixacerta.com.br www.app-faixacerta.com.br s3.app-faixacerta.com.br;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/faixa-certa-acme;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.app-faixacerta.com.br;

    ssl_certificate     /etc/letsencrypt/live/app-faixacerta.com.br/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/app-faixacerta.com.br/privkey.pem;
    return 301 https://app-faixacerta.com.br$request_uri;
}

# Painel web + API
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name app-faixacerta.com.br;

    ssl_certificate     /etc/letsencrypt/live/app-faixacerta.com.br/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/app-faixacerta.com.br/privkey.pem;

    client_max_body_size 20m;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    location ~ ^/(v1|health)(/|$) {
        proxy_pass http://127.0.0.1:8851;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 120s;
    }

    location / {
        proxy_pass http://127.0.0.1:8850;
        proxy_set_header Host $host;
    }
}

# Storage S3 (RustFS): uploads por URL assinada e mídia pública
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name s3.app-faixacerta.com.br;

    ssl_certificate     /etc/letsencrypt/live/app-faixacerta.com.br/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/app-faixacerta.com.br/privkey.pem;

    client_max_body_size 0;
    proxy_request_buffering off;
    proxy_buffering off;

    location / {
        proxy_pass http://127.0.0.1:8852;
        proxy_http_version 1.1;
        # O Host precisa chegar intacto: faz parte da assinatura das URLs pré-assinadas.
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }
}
