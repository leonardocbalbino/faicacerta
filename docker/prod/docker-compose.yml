# Produção (VPS). Uso, a partir da raiz do repositório:
#   docker compose -f docker/prod/docker-compose.yml --env-file docker/prod/.env up -d --build
# Portas presas em 127.0.0.1: o nginx do host faz o TLS e o roteamento por domínio.
name: faixa-certa

x-api: &api
  build:
    context: ../..
    target: api
  image: faixa-certa-api:latest
  restart: unless-stopped
  env_file: .env
  environment:
    NODE_ENV: production
    DATABASE_URL: postgresql://faixacerta:${POSTGRES_PASSWORD}@postgres:5432/faixacerta
    REDIS_URL: redis://redis:6379
    S3_ENDPOINT: http://rustfs:9000
    S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID}
    S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY}
  depends_on:
    postgres: { condition: service_healthy }
    redis: { condition: service_healthy }
    rustfs: { condition: service_started }

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: faixacerta
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: faixacerta
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U faixacerta -d faixacerta']
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ['redis-server', '--appendonly', 'yes']
    volumes:
      - redisdata:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 20

  rustfs:
    image: rustfs/rustfs:1.0.6
    restart: unless-stopped
    command: ['/data']
    environment:
      RUSTFS_ACCESS_KEY: ${S3_ACCESS_KEY_ID}
      RUSTFS_SECRET_KEY: ${S3_SECRET_ACCESS_KEY}
      RUSTFS_ADDRESS: ':9000'
      RUSTFS_CONSOLE_ENABLE: 'false'
    ports:
      - '127.0.0.1:8852:9000'
    volumes:
      - rustfsdata:/data

  api:
    <<: *api
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://faixacerta:${POSTGRES_PASSWORD}@postgres:5432/faixacerta
      REDIS_URL: redis://redis:6379
      S3_ENDPOINT: http://rustfs:9000
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY}
      WORKERS_ENABLED: 'false'
    ports:
      - '127.0.0.1:8851:3000'

  worker:
    <<: *api
    command: ['node', 'dist/worker.js']

  web:
    build:
      context: ../..
      target: web
    image: faixa-certa-web:latest
    restart: unless-stopped
    ports:
      - '127.0.0.1:8850:80'

volumes:
  pgdata:
  redisdata:
  rustfsdata:
